<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Into the Wild</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #000;
      overflow-x: hidden;
    }

    /* =====================
       SCROLL DRIVER
    ===================== */
    .scroll-driver {
      height: 15000px;
      width: 100%;
      position: relative;
      z-index: 0;
    }

    /* =====================
       FIXED SCENE
    ===================== */
    .scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
    }

    /* =====================
       PARALLAX LAYERS
    ===================== */
    .layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      will-change: transform;
    }

    .layer-sky {
      background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1920&q=80');
      background-position: center top;
      z-index: 1;
    }

    .layer-jungle-far {
      background-image: url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&w=1920&q=80');
      z-index: 2;
    }

    .layer-jungle-mid {
      background-image: url('https://images.unsplash.com/photo-1516912481808-3406841bd33c?auto=format&fit=crop&w=1920&q=80');
      z-index: 3;
    }

    .layer-jungle-near {
      background-image: url('https://images.unsplash.com/photo-1504567961542-e24d9439a724?auto=format&fit=crop&w=1920&q=80');
      height: 60%;
      top: auto;
      bottom: 0;
      z-index: 4;
      background-position: center bottom;
    }

    .layer-ground {
      background: linear-gradient(to top, #0a0a05 0%, #1a1f10 35%, transparent 100%);
      height: 30%;
      top: auto;
      bottom: 0;
      z-index: 5;
    }

    /* =====================
       COLOR OVERLAY
    ===================== */
    .layer-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 6;
      pointer-events: none;
      background: rgba(135, 206, 235, 0.0);
      mix-blend-mode: multiply;
      transition: background 0.5s ease;
    }

    /* =====================
       VIGNETTE
    ===================== */
    .layer-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
      background: radial-gradient(ellipse at center,
        transparent 40%,
        rgba(0, 0, 0, 0.5) 75%,
        rgba(0, 0, 0, 0.85) 100%
      );
    }

    /* =====================
       TRAIN
    ===================== */
    .layer-train {
      position: absolute;
      bottom: 15%;
      left: 8%;
      width: 380px;
      height: auto;
      z-index: 10;
      pointer-events: none;
      object-fit: contain;
      animation: trainBob 1.5s ease-in-out infinite;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.7));
    }

    @keyframes trainBob {
      0%   { transform: translateY(0px); }
      50%  { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    /* =====================
       SMOKE
    ===================== */
    .smoke-container {
      position: absolute;
      bottom: calc(15% + 200px);
      left: calc(8% + 80px);
      z-index: 11;
      pointer-events: none;
    }

    .smoke {
      position: absolute;
      border-radius: 50%;
      background: rgba(200, 200, 190, 0.5);
      animation: smokeRise 2.5s ease-out infinite;
    }

    .smoke-1 {
      width: 18px;
      height: 18px;
      left: 0;
      animation-delay: 0s;
    }

    .smoke-2 {
      width: 24px;
      height: 24px;
      left: 8px;
      animation-delay: 0.8s;
    }

    .smoke-3 {
      width: 14px;
      height: 14px;
      left: 4px;
      animation-delay: 1.6s;
    }

    @keyframes smokeRise {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.6;
      }
      50% {
        transform: translateY(-40px) scale(1.8) translateX(10px);
        opacity: 0.3;
      }
      100% {
        transform: translateY(-90px) scale(3) translateX(20px);
        opacity: 0;
      }
    }

    /* =====================
       ANIMALS
    ===================== */
    .animal {
      position: absolute;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      will-change: opacity;
    }

    .animal-deer {
      bottom: 18%;
      left: 3%;
      width: 300px;
      z-index: 9;
      mix-blend-mode: multiply;
    }

    .animal-birds {
      top: 12%;
      left: 20%;
      width: 500px;
      z-index: 8;
      mix-blend-mode: multiply;
      animation: birdFly 8s linear infinite paused;
    }

    .animal-birds.visible {
      animation-play-state: running;
    }

    @keyframes birdFly {
      0%   { transform: translateX(0px); }
      50%  { transform: translateX(60px); }
      100% { transform: translateX(0px); }
    }

    .animal-elephant {
      bottom: 10%;
      right: 2%;
      width: 400px;
      z-index: 9;
      mix-blend-mode: multiply;
    }

    .animal-tiger {
      bottom: 12%;
      left: 40%;
      width: 350px;
      z-index: 9;
      mix-blend-mode: multiply;
    }

    .animal-fireflies {
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 12;
      mix-blend-mode: screen;
    }

    .animal-owl {
      top: 8%;
      right: 5%;
      width: 200px;
      z-index: 9;
      mix-blend-mode: multiply;
    }

    .animal-wolf {
      bottom: 14%;
      left: 4%;
      width: 300px;
      z-index: 9;
      mix-blend-mode: multiply;
    }

    .animal-fox {
      bottom: 12%;
      right: 4%;
      width: 250px;
      z-index: 9;
      mix-blend-mode: multiply;
    }

    /* =====================
       TRACK LINES
    ===================== */
    .tracks {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 15;
      pointer-events: none;
    }

    .rail {
      height: 3px;
      background: rgba(150, 120, 80, 0.6);
      width: 100%;
    }

    .rail-top {
      margin-bottom: 34px;
    }

    .sleepers {
      height: 40px;
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 50px,
        rgba(120, 90, 60, 0.4) 50px,
        rgba(120, 90, 60, 0.4) 80px
      );
    }

    /* =====================
       TEXT OVERLAYS
    ===================== */
    .text-overlay {
      position: absolute;
      z-index: 18;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2rem, 5vw, 4rem);
      color: #fff;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8);
      letter-spacing: 0.05em;
      line-height: 1.2;
      will-change: opacity;
    }

    .text-aboard {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      white-space: nowrap;
    }

    .text-jungle {
      top: 45%;
      left: 6%;
      text-align: left;
      max-width: 50%;
    }

    .text-night {
      top: 40%;
      right: 6%;
      text-align: right;
      max-width: 50%;
    }

    .text-journey {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      white-space: nowrap;
      font-style: italic;
    }

    /* =====================
       GRAIN TEXTURE
    ===================== */
    .grain-svg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.04;
    }
  </style>
</head>
<body>

  <!-- SCENE: fixed full-viewport -->
  <div class="scene" id="scene">

    <!-- PARALLAX LAYERS -->
    <div class="layer layer-sky"         id="layerSky"></div>
    <div class="layer layer-jungle-far"  id="layerJungleFar"></div>
    <div class="layer layer-jungle-mid"  id="layerJungleMid"></div>
    <div class="layer layer-jungle-near" id="layerJungleNear"></div>
    <div class="layer layer-ground"      id="layerGround"></div>

    <!-- COLOR SHIFT OVERLAY -->
    <div class="layer-overlay" id="colorOverlay"></div>

    <!-- TRAIN -->
    <img
      class="layer-train"
      src="https://images.unsplash.com/photo-1474487548417-781cb6d646b4?auto=format&fit=crop&w=800&q=80"
      alt="Vintage train through forest"
      loading="lazy"
      onerror="this.style.display='none'"
    />

    <!-- SMOKE -->
    <div class="smoke-container" id="smokeContainer">
      <div class="smoke smoke-1"></div>
      <div class="smoke smoke-2"></div>
      <div class="smoke smoke-3"></div>
    </div>

    <!-- ANIMALS -->
    <img
      id="animalDeer"
      class="animal animal-deer"
      src="https://images.unsplash.com/photo-1484406566174-9da000fda645?auto=format&fit=crop&w=600&q=80"
      alt="Deer in forest"
      loading="lazy"
      onerror="this.style.display='none'"
    />

    <img
      id="animalBirds"
      class="animal animal-birds"
      src="https://images.unsplash.com/photo-1444464666168-49d633b86797?auto=format&fit=crop&w=1000&q=80"
      alt="Birds in flight"
      loading="lazy"
      onerror="this.style.display='none'"
    />

    <img
      id="animalElephant"
      class="animal animal-elephant"
      src="https://images.unsplash.com/photo-1564760055775-d63b17a55c44?auto=format&fit=crop&w=800&q=80"
      alt="Elephant in the wild"
      loading="lazy"
      onerror="this.style.display='none'"
    />

    <img
      id="animalTiger"
      class="animal animal-tiger"
      src="https://images.unsplash.com/photo-1549480017-d76466a4b7e8?auto=format&fit=crop&w=700&q=80"
      alt="Tiger in jungle"
      loading="lazy"
      onerror="this.style.display='none'"
    />

    <img
      id="animalFireflies"
      class="animal animal-fireflies"
      src="https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?auto=format&fit=crop&w=1920&q=80"
      alt="Fireflies bokeh"
      loading="lazy"
      onerror="this.style.display='none'"
    />

    <img
      id="animalOwl"
      class="animal animal-owl"
      src="https://images.unsplash.com/photo-1543549790-8b5f4a028cfb?auto=format&fit=crop&w=400&q=80"
      alt="Owl on branch"
      loading="lazy"
      onerror="this.style.display='none'"
    />

    <img
      id="animalWolf"
      class="animal animal-wolf"
      src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?auto=format&fit=crop&w=600&q=80"
      alt="Wolf in the wild"
      loading="lazy"
      onerror="this.style.display='none'"
    />

    <img
      id="animalFox"
      class="animal animal-fox"
      src="https://images.unsplash.com/photo-1474511320723-9a56873867b5?auto=format&fit=crop&w=500&q=80"
      alt="Fox in forest"
      loading="lazy"
      onerror="this.style.display='none'"
    />

    <!-- TEXT OVERLAYS -->
    <div class="text-overlay text-aboard"  id="textAboard">All aboard.</div>
    <div class="text-overlay text-jungle"  id="textJungle">The jungle breathes.</div>
    <div class="text-overlay text-night"   id="textNight">Night falls slowly.</div>
    <div class="text-overlay text-journey" id="textJourney">Some journeys never end.</div>

    <!-- VIGNETTE (always on top of scene content) -->
    <div class="layer-vignette"></div>

  </div>

  <!-- TRACK LINES (outside scene so they sit above) -->
  <!-- Railroad track background reference photo (preloaded, hidden) -->
  <img
    src="https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?auto=format&fit=crop&w=1920&q=80"
    alt="Railroad through jungle"
    loading="lazy"
    onerror="this.style.display='none'"
    style="display:none;"
  />
  <div class="tracks">
    <div class="sleepers"></div>
    <div class="rail rail-bottom"></div>
    <div style="height:34px;"></div>
    <div class="rail rail-top"></div>
  </div>

  <!-- SCROLL DRIVER -->
  <div class="scroll-driver" id="scrollDriver"></div>

  <!-- GRAIN TEXTURE -->
  <svg class="grain-svg" xmlns="http://www.w3.org/2000/svg">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#grain)"/>
  </svg>

  <script>
    // =====================
    // ELEMENT REFERENCES
    // =====================
    var layerSky        = document.getElementById('layerSky');
    var layerJungleFar  = document.getElementById('layerJungleFar');
    var layerJungleMid  = document.getElementById('layerJungleMid');
    var layerJungleNear = document.getElementById('layerJungleNear');
    var layerGround     = document.getElementById('layerGround');
    var colorOverlay    = document.getElementById('colorOverlay');

    var animalDeer      = document.getElementById('animalDeer');
    var animalBirds     = document.getElementById('animalBirds');
    var animalElephant  = document.getElementById('animalElephant');
    var animalTiger     = document.getElementById('animalTiger');
    var animalFireflies = document.getElementById('animalFireflies');
    var animalOwl       = document.getElementById('animalOwl');
    var animalWolf      = document.getElementById('animalWolf');
    var animalFox       = document.getElementById('animalFox');

    var textAboard  = document.getElementById('textAboard');
    var textJungle  = document.getElementById('textJungle');
    var textNight   = document.getElementById('textNight');
    var textJourney = document.getElementById('textJourney');

    // =====================
    // SCROLL STATE
    // =====================
    var targetScroll  = 0;
    var currentScroll = 0;

    window.addEventListener('scroll', function() {
      targetScroll = window.scrollY;
    });

    // =====================
    // HELPERS
    // =====================
    function clamp(val, min, max) {
      return Math.min(Math.max(val, min), max);
    }

    // Returns 0 to 1 as progress moves from start to end window
    function windowProgress(progress, start, end) {
      if (progress < start) return 0;
      if (progress > end) return 1;
      return (progress - start) / (end - start);
    }

    // Fade in from start, fade out at end
    function fadeInOut(progress, inStart, inEnd, outStart, outEnd) {
      if (progress < inStart || progress > outEnd) return 0;
      if (progress >= inEnd && progress <= outStart) return 1;
      if (progress < inEnd) return windowProgress(progress, inStart, inEnd);
      return 1 - windowProgress(progress, outStart, outEnd);
    }

    // Lerp between two color values (returns string)
    function lerpColor(r1, g1, b1, a1, r2, g2, b2, a2, t) {
      var r = Math.round(r1 + (r2 - r1) * t);
      var g = Math.round(g1 + (g2 - g1) * t);
      var b = Math.round(b1 + (b2 - b1) * t);
      var a = (a1 + (a2 - a1) * t).toFixed(2);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
    }

    // =====================
    // DAY/NIGHT OVERLAY
    // =====================
    function updateOverlay(progress) {
      var color;
      if (progress <= 0.2) {
        // Clear day
        var t = progress / 0.2;
        color = lerpColor(135, 206, 235, 0.0, 255, 140, 66, 0.0, t);
      } else if (progress <= 0.4) {
        // Golden hour
        var t = (progress - 0.2) / 0.2;
        color = lerpColor(255, 140, 66, 0.0, 255, 140, 66, 0.3, t);
      } else if (progress <= 0.6) {
        // Sunset red
        var t = (progress - 0.4) / 0.2;
        color = lerpColor(255, 140, 66, 0.3, 180, 50, 50, 0.4, t);
      } else if (progress <= 0.8) {
        // Dusk blue
        var t = (progress - 0.6) / 0.2;
        color = lerpColor(180, 50, 50, 0.4, 20, 20, 80, 0.6, t);
      } else {
        // Deep night
        var t = (progress - 0.8) / 0.2;
        color = lerpColor(20, 20, 80, 0.6, 5, 5, 20, 0.8, t);
      }
      colorOverlay.style.background = color;
    }

    // =====================
    // PARALLAX
    // =====================
    function updateParallax(scroll) {
      layerSky.style.transform        = 'translateY(' + (scroll * 0.1) + 'px)';
      layerJungleFar.style.transform  = 'translateY(' + (scroll * 0.2) + 'px)';
      layerJungleMid.style.transform  = 'translateY(' + (scroll * 0.35) + 'px)';
      layerJungleNear.style.transform = 'translateY(' + (scroll * 0.6) + 'px)';
      layerGround.style.transform     = 'translateY(' + (scroll * 1.0) + 'px)';
    }

    // =====================
    // ANIMALS
    // =====================
    function updateAnimals(progress) {
      // Deer: 10-20%
      var deerOpacity = fadeInOut(progress, 0.10, 0.14, 0.16, 0.20);
      animalDeer.style.opacity = deerOpacity;

      // Birds: 22-32%
      var birdsOpacity = fadeInOut(progress, 0.22, 0.26, 0.28, 0.32);
      animalBirds.style.opacity = birdsOpacity;
      if (birdsOpacity > 0.1) {
        animalBirds.classList.add('visible');
      } else {
        animalBirds.classList.remove('visible');
      }

      // Elephant: 35-45%
      var elephantOpacity = fadeInOut(progress, 0.35, 0.39, 0.41, 0.45);
      animalElephant.style.opacity = elephantOpacity;

      // Tiger: 48-57%
      var tigerOpacity = fadeInOut(progress, 0.48, 0.52, 0.53, 0.57);
      animalTiger.style.opacity = tigerOpacity;

      // Fireflies: 55-68%  (max opacity 0.4)
      var firefliesOpacity = fadeInOut(progress, 0.55, 0.60, 0.64, 0.68) * 0.4;
      animalFireflies.style.opacity = firefliesOpacity;

      // Owl: 65-75%
      var owlOpacity = fadeInOut(progress, 0.65, 0.69, 0.71, 0.75);
      animalOwl.style.opacity = owlOpacity;

      // Wolf: 77-87%
      var wolfOpacity = fadeInOut(progress, 0.77, 0.81, 0.83, 0.87);
      animalWolf.style.opacity = wolfOpacity;

      // Fox: 88-95%
      var foxOpacity = fadeInOut(progress, 0.88, 0.91, 0.93, 0.95);
      animalFox.style.opacity = foxOpacity;
    }

    // =====================
    // TEXT OVERLAYS
    // =====================
    function updateText(progress) {
      // "All aboard." 0-8%
      textAboard.style.opacity  = fadeInOut(progress, 0.00, 0.02, 0.06, 0.08);
      // "The jungle breathes." 28-38%
      textJungle.style.opacity  = fadeInOut(progress, 0.28, 0.31, 0.35, 0.38);
      // "Night falls slowly." 58-68%
      textNight.style.opacity   = fadeInOut(progress, 0.58, 0.61, 0.65, 0.68);
      // "Some journeys never end." 90-100%
      textJourney.style.opacity = fadeInOut(progress, 0.90, 0.93, 0.97, 1.00);
    }

    // =====================
    // MAIN ANIMATION LOOP
    // =====================
    function animate() {
      // Smooth lerp toward target scroll
      currentScroll += (targetScroll - currentScroll) * 0.08;

      var maxScroll = document.body.scrollHeight - window.innerHeight;
      var progress  = maxScroll > 0 ? clamp(currentScroll / maxScroll, 0, 1) : 0;

      updateParallax(currentScroll);
      updateOverlay(progress);
      updateAnimals(progress);
      updateText(progress);

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
